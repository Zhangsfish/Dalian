<line x1="100" y1="70" x2="1000" y2="70" class="grid"/><text x="85" y="75" text-anchor="end" class="s">+4pp</text>
<text x="230" y="595" text-anchor="middle" class="h">事前2007–2010</text><text x="530" y="595" text-anchor="middle" class="h">事前2008–2010</text><text x="830" y="595" text-anchor="middle" class="h">事前2009–2010</text>
