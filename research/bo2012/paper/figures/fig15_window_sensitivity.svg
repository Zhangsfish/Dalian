<rect x="260" y="368" width="70" height="22" class="ext"/><text x="295" y="355" text-anchor="middle" class="s">+0.28</text>
<rect x="560" y="350.6" width="70" height="39.4" class="ext"/><text x="595" y="338" text-anchor="middle" class="s">+0.49</text>
