<line x1="85" y1="445" x2="1090" y2="445" class="grid"/><text x="72" y="450" text-anchor="end" class="s">−3pp</text>
<line x1="85" y1="385" x2="1090" y2="385" class="grid"/><text x="72" y="390" text-anchor="end" class="s">−1pp</text>
<line x1="85" y1="355" x2="1090" y2="355" class="axis"/><text x="72" y="360" text-anchor="end" class="s">0</text>
<line x1="85" y1="325" x2="1090" y2="325" class="grid"/><text x="72" y="330" text-anchor="end" class="s">+1pp</text>
<line x1="85" y1="265" x2="1090" y2="265" class="grid"/><text x="72" y="270" text-anchor="end" class="s">+3pp</text>
