<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#222}.t{font-size:25px;font-weight:650}.s{font-size:15px}.h{font-size:17px;font-weight:600}.axis{stroke:#555;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.out{fill:none;stroke:#111;stroke-width:3}.ln{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:9 5}.event{stroke:#888;stroke-width:1.5;stroke-dasharray:6 5}.warn{font-size:14px;fill:#555}</style>
<text x="75" y="38" class="t">图6｜大连相对省外参照与相对辽宁的年度增长差</text>
