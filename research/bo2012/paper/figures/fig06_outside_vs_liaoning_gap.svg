<circle cx="940" cy="319" r="4.5" fill="white" stroke="#777" stroke-width="2"/><text x="955" y="309" class="s">2015：大连仍快1.2pp</text>
<circle cx="1060" cy="85" r="5" fill="white" stroke="#777" stroke-width="2"/><text x="870" y="72" class="warn">2016相对辽宁+9pp：统计/记录异常风险，非主窗口</text>
<line x1="85" y1="592" x2="130" y2="592" stroke="#111" stroke-width="3"/><text x="140" y="598" class="s">大连 − 武汉/青岛均值</text>
