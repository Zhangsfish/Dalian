<text x="100" y="535" class="s" text-anchor="middle">2008</text><text x="220" y="535" class="s" text-anchor="middle">2009</text><text x="340" y="535" class="s" text-anchor="middle">2010</text><text x="460" y="535" class="s" text-anchor="middle">2011</text><text x="580" y="535" class="s" text-anchor="middle">2012</text><text x="700" y="535" class="s" text-anchor="middle">2013</text><text x="820" y="535" class="s" text-anchor="middle">2014</text><text x="940" y="535" class="s" text-anchor="middle">2015</text><text x="1060" y="535" class="s" text-anchor="middle">2016</text>
