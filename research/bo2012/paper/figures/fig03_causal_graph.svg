<text x="55" y="640" class="s">识别含义：GDP或投资下降本身不能区分政治网络、区域共同冲击与本地结构暴露；统计修订还可能改变观测结果。</text>
<text x="55" y="670" class="s">因此本文要求“相对异常 + 机制变量 + 时间顺序 + 竞争解释 + 平行处理案例”共同约束政治叙事。</text>
