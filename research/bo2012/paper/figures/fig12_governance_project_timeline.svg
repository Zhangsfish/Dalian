<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#222}.t{font-size:25px;font-weight:650}.s{font-size:14px}.h{font-size:17px;font-weight:600}.axis{stroke:#777;stroke-width:1}.band{fill:#e8e8e8;stroke:#666;stroke-width:1}.event{fill:#555}.proj{fill:#999}</style>
<text x="65" y="38" class="t">图12｜2011—2017年大连领导连续性与国家级平台时间线</text>
<line x1="155" y1="590" x2="1170" y2="590" class="axis"/>
<text x="190" y="620" class="s" text-anchor="middle">2011</text><text x="340" y="620" class="s" text-anchor="middle">2012</text><text x="490" y="620" class="s" text-anchor="middle">2013</text><text x="640" y="620" class="s" text-anchor="middle">2014</text><text x="790" y="620" class="s" text-anchor="middle">2015</text><text x="940" y="620" class="s" text-anchor="middle">2016</text><text x="1090" y="620" class="s" text-anchor="middle">2017</text>
<text x="65" y="115" class="h">市委书记</text><rect x="265" y="85" width="810" height="52" class="band"/><text x="670" y="117" text-anchor="middle" class="h">唐军（2011.06—2017.02）</text>
<text x="65" y="205" class="h">市长</text><rect x="155" y="175" width="635" height="52" class="band"/><text x="472" y="207" text-anchor="middle" class="h">李万才（至2014.12）</text><rect x="790" y="175" width="380" height="52" class="band"/><text x="980" y="207" text-anchor="middle" class="h">肖盛峰</text>
