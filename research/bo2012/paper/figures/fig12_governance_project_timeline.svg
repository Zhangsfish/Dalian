<line x1="340" y1="65" x2="340" y2="550" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/><text x="350" y="78" class="s">2012政治事件</text>
<text x="155" y="665" class="s">经济分叉最明显的2014—2015位于同一市委书记任期内，同时国家级平台和大型项目仍持续落地。</text>
