<circle cx="940" cy="305" r="10" class="event"/><text x="940" y="270" text-anchor="middle" class="s">跨境电商综试区</text><text x="940" y="330" text-anchor="middle" class="s">2016</text>
<circle cx="1090" cy="305" r="10" class="event"/><text x="1090" y="270" text-anchor="middle" class="s">辽宁自贸区大连片区</text><text x="1090" y="330" text-anchor="middle" class="s">2017</text>
