<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760">
<rect width="100%" height="100%" fill="white"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#222}
.t{font-size:25px;font-weight:650}.h{font-size:18px;font-weight:600}.s{font-size:14px}.axis{stroke:#555;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}
.gdp{fill:none;stroke:#111;stroke-width:3}.sec{fill:none;stroke:#666;stroke-width:3;stroke-dasharray:9 5}.ter{fill:none;stroke:#aaa;stroke-width:3;stroke-dasharray:3 5}
.rev{fill:none;stroke:#444;stroke-width:3}.profit{fill:none;stroke:#888;stroke-width:3;stroke-dasharray:9 5}.zero{stroke:#555;stroke-width:1.2}
</style>
<text x="70" y="38" class="t">图6A｜GDP拆开以后：第二产业失速先于信用收缩</text>

<text x="70" y="82" class="h">A. 大连GDP与二、三产业增加值增速</text>
<line x1="90" y1="335" x2="1140" y2="335" class="axis"/><line x1="90" y1="100" x2="90" y2="335" class="axis"/>
<line x1="90" y1="300" x2="1140" y2="300" class="grid"/><text x="75" y="305" text-anchor="end" class="s">0%</text>
<line x1="90" y1="230" x2="1140" y2="230" class="grid"/><text x="75" y="235" text-anchor="end" class="s">4%</text>
<line x1="90" y1="160" x2="1140" y2="160" class="grid"/><text x="75" y="165" text-anchor="end" class="s">8%</text>
<line x1="90" y1="125" x2="1140" y2="125" class="grid"/><text x="75" y="130" text-anchor="end" class="s">10%</text>
<text x="280" y="365" text-anchor="middle" class="s">2013</text><text x="610" y="365" text-anchor="middle" class="s">2014</text><text x="940" y="365" text-anchor="middle" class="s">2015</text>
<!-- y = 300 - value*17.5 -->
<polyline points="280,142.5 610,198.5 940,226.5" class="gdp"/>
<polyline points="280,135.5 610,212.5 940,284.25" class="sec"/>
<polyline points="280,140.75 610,177.5 940,156.5" class="ter"/>
<circle cx="280" cy="142.5" r="4" fill="white" stroke="#111"/><circle cx="610" cy="198.5" r="4" fill="white" stroke="#111"/><circle cx="940" cy="226.5" r="4" fill="white" stroke="#111"/>
<circle cx="280" cy="135.5" r="4" fill="white" stroke="#666"/><circle cx="610" cy="212.5" r="4" fill="white" stroke="#666"/><circle cx="940" cy="284.25" r="4" fill="white" stroke="#666"/>
<circle cx="280" cy="140.75" r="4" fill="white" stroke="#aaa"/><circle cx="610" cy="177.5" r="4" fill="white" stroke="#aaa"/><circle cx="940" cy="156.5" r="4" fill="white" stroke="#aaa"/>
<text x="958" y="289" class="s">第二产业 0.9%</text><text x="958" y="152" class="s">第三产业 8.2%</text>
<line x1="120" y1="405" x2="160" y2="405" stroke="#111" stroke-width="3"/><text x="170" y="411" class="s">GDP</text>
<line x1="255" y1="405" x2="295" y2="405" stroke="#666" stroke-width="3" stroke-dasharray="9 5"/><text x="305" y="411" class="s">第二产业</text>
<line x1="420" y1="405" x2="460" y2="405" stroke="#aaa" stroke-width="3" stroke-dasharray="3 5"/><text x="470" y="411" class="s">第三产业</text>

<text x="70" y="465" class="h">B. 大连规模以上工业主营业务收入与利润增速</text>
<line x1="90" y1="690" x2="1140" y2="690" class="axis"/><line x1="90" y1="485" x2="90" y2="690" class="axis"/>
<line x1="90" y1="560" x2="1140" y2="560" class="zero"/><text x="75" y="565" text-anchor="end" class="s">0%</text>
<line x1="90" y1="510" x2="1140" y2="510" class="grid"/><text x="75" y="515" text-anchor="end" class="s">+25%</text>
<line x1="90" y1="610" x2="1140" y2="610" class="grid"/><text x="75" y="615" text-anchor="end" class="s">−25%</text>
<line x1="90" y1="640" x2="1140" y2="640" class="grid"/><text x="75" y="645" text-anchor="end" class="s">−40%</text>
<text x="280" y="720" text-anchor="middle" class="s">2013</text><text x="610" y="720" text-anchor="middle" class="s">2014</text><text x="940" y="720" text-anchor="middle" class="s">2015</text>
<!-- y=560-value*2 -->
<polyline points="280,540.6 610,569.8 940,614.8" class="rev"/>
<polyline points="280,507.8 610,569.2 940,621.4" class="profit"/>
<circle cx="280" cy="540.6" r="4" fill="white" stroke="#444"/><circle cx="610" cy="569.8" r="4" fill="white" stroke="#444"/><circle cx="940" cy="614.8" r="4" fill="white" stroke="#444"/>
<circle cx="280" cy="507.8" r="4" fill="white" stroke="#888"/><circle cx="610" cy="569.2" r="4" fill="white" stroke="#888"/><circle cx="940" cy="621.4" r="4" fill="white" stroke="#888"/>
<text x="958" y="612" class="s">收入 −27.4%</text><text x="958" y="631" class="s">利润 −30.7%</text>
<line x1="120" y1="750" x2="160" y2="750" stroke="#444" stroke-width="3"/><text x="170" y="756" class="s">主营业务收入</text>
<line x1="330" y1="750" x2="370" y2="750" stroke="#888" stroke-width="3" stroke-dasharray="9 5"/><text x="380" y="756" class="s">利润总额</text>
</svg>