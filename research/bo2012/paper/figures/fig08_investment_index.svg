<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#222}.t{font-size:25px;font-weight:650}.s{font-size:15px}.h{font-size:17px;font-weight:600}.axis{stroke:#555;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.df{fill:none;stroke:#111;stroke-width:3}.lf{fill:none;stroke:#555;stroke-width:3;stroke-dasharray:9 5}.dr{fill:none;stroke:#888;stroke-width:2.7}.lr{fill:none;stroke:#aaa;stroke-width:2.7;stroke-dasharray:7 5}</style>
