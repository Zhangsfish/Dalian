<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="610" viewBox="0 0 1050 610">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#222}.t{font-size:25px;font-weight:650}.s{font-size:15px}.h{font-size:17px;font-weight:600}.axis{stroke:#555;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.line{fill:none;stroke:#111;stroke-width:3}</style>
<text x="75" y="38" class="t">图10｜大连不良贷款率：2013年后持续上升</text>
<line x1="90" y1="500" x2="970" y2="500" class="axis"/><line x1="90" y1="80" x2="90" y2="500" class="axis"/>
<line x1="90" y1="500" x2="970" y2="500" class="grid"/><text x="75" y="505" text-anchor="end" class="s">0%</text>
<line x1="90" y1="380" x2="970" y2="380" class="grid"/><text x="75" y="385" text-anchor="end" class="s">1%</text>
<line x1="90" y1="260" x2="970" y2="260" class="grid"/><text x="75" y="265" text-anchor="end" class="s">2%</text>
<line x1="90" y1="140" x2="970" y2="140" class="grid"/><text x="75" y="145" text-anchor="end" class="s">3%</text>
<text x="190" y="535" text-anchor="middle" class="h">2013</text><text x="410" y="535" text-anchor="middle" class="h">2014</text><text x="630" y="535" text-anchor="middle" class="h">2015</text><text x="850" y="535" text-anchor="middle" class="h">2016</text>
<!-- y=500-value*120 -->
<polyline points="190,371.6 410,276.8 630,240.8 850,113.6" class="line"/>
<circle cx="190" cy="371.6" r="5" fill="white" stroke="#111" stroke-width="2"/><circle cx="410" cy="276.8" r="5" fill="white" stroke="#111" stroke-width="2"/><circle cx="630" cy="240.8" r="5" fill="white" stroke="#111" stroke-width="2"/><circle cx="850" cy="113.6" r="5" fill="white" stroke="#111" stroke-width="2"/>
<text x="205" y="357" class="s">1.07%</text><text x="425" y="262" class="s">1.86%</text><text x="645" y="226" class="s">2.16%</text><text x="865" y="100" class="s">3.22%</text>
<text x="90" y="580" class="s">贷款增速下降与不良率上升在2014以后同步出现，信用风险与融资收缩形成同一反馈过程。</text>
</svg>