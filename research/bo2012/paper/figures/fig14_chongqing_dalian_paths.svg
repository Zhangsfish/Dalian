<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#222}.t{font-size:25px;font-weight:650}.s{font-size:14px}.h{font-size:18px;font-weight:600}.axis{stroke:#555;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.cq{fill:none;stroke:#111;stroke-width:3}.dl{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:9 5}.zero{stroke:#555;stroke-width:1.2}</style>
<text x="70" y="38" class="t">图14｜重庆与大连的信贷和固定资产投资路径</text>
<text x="70" y="82" class="h">A. 银行贷款增速</text>
<line x1="90" y1="340" x2="1140" y2="340" class="axis"/><line x1="90" y1="105" x2="90" y2="340" class="axis"/>
<line x1="90" y1="280" x2="1140" y2="280" class="grid"/><text x="75" y="285" text-anchor="end" class="s">5%</text>
<line x1="90" y1="220" x2="1140" y2="220" class="grid"/><text x="75" y="225" text-anchor="end" class="s">10%</text>
<line x1="90" y1="160" x2="1140" y2="160" class="grid"/><text x="75" y="165" text-anchor="end" class="s">15%</text>
<line x1="90" y1="100" x2="1140" y2="100" class="grid"/><text x="75" y="105" text-anchor="end" class="s">20%</text>
<text x="180" y="365" text-anchor="middle" class="s">2011</text><text x="350" y="365" text-anchor="middle" class="s">2012</text><text x="520" y="365" text-anchor="middle" class="s">2013</text><text x="690" y="365" text-anchor="middle" class="s">2014</text><text x="860" y="365" text-anchor="middle" class="s">2015</text><text x="1030" y="365" text-anchor="middle" class="s">2016</text>
<!-- y=340-value*12 -->
<polyline points="180,100 350,121.6 520,154 690,164.8 860,205.6 1030,205.7" class="cq"/><polyline points="180,144.2 350,158.8 520,201.3 690,251.2 860,262.3 1030,312.2" class="dl"/>
<text x="1045" y="201" class="s">重庆 11.2%</text><text x="1045" y="315" class="s">大连 2.3%</text>
<text x="70" y="420" class="h">B. 固定资产投资增速</text>
<line x1="90" y1="690" x2="1140" y2="690" class="axis"/><line x1="90" y1="455" x2="90" y2="690" class="axis"/>
<line x1="90" y1="620" x2="1140" y2="620" class="zero"/><text x="75" y="625" text-anchor="end" class="s">0</text>
<line x1="90" y1="550" x2="1140" y2="550" class="grid"/><text x="75" y="555" text-anchor="end" class="s">+10%</text>
<line x1="90" y1="480" x2="1140" y2="480" class="grid"/><text x="75" y="485" text-anchor="end" class="s">+20%</text>
<text x="350" y="715" text-anchor="middle" class="s">2012</text><text x="520" y="715" text-anchor="middle" class="s">2013</text><text x="690" y="715" text-anchor="middle" class="s">2014</text><text x="860" y="715" text-anchor="middle" class="s">2015</text><text x="1030" y="715" text-anchor="middle" class="s">2016</text>
<!-- y=620-value*7 for positive and negative -->
<polyline points="350,466 520,483.5 690,494 860,500.3 1030,535.3" class="cq"/>
<!-- Dalian only 2013-2015 -->
<polyline points="520,513.6 690,587.8 860,848.9" class="dl"/>
<text x="875" y="510" class="s">重庆2015 +17.1%</text><text x="875" y="670" class="s">大连2015 −32.7%（超出绘图区下方）</text>
<line x1="780" y1="75" x2="820" y2="75" stroke="#111" stroke-width="3"/><text x="830" y="81" class="s">重庆</text><line x1="930" y1="75" x2="970" y2="75" stroke="#777" stroke-width="3" stroke-dasharray="9 5"/><text x="980" y="81" class="s">大连</text>
</svg>