<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#222}.t{font-size:25px;font-weight:650}.s{font-size:15px}.h{font-size:17px;font-weight:600}.axis{stroke:#555;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.d{fill:none;stroke:#111;stroke-width:3}.ln{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:9 5}.gap{fill:none;stroke:#aaa;stroke-width:2.5;stroke-dasharray:3 5}.event{stroke:#888;stroke-width:1.5;stroke-dasharray:6 5}</style>
<text x="80" y="38" class="t">图9｜大连与辽宁贷款增速及相对差值</text>
<!-- left panel loan growth -->
<line x1="90" y1="500" x2="780" y2="500" class="axis"/><line x1="90" y1="80" x2="90" y2="500" class="axis"/>
<line x1="90" y1="430" x2="780" y2="430" class="grid"/><text x="75" y="435" text-anchor="end" class="s">5%</text>
<line x1="90" y1="360" x2="780" y2="360" class="grid"/><text x="75" y="365" text-anchor="end" class="s">10%</text>
<line x1="90" y1="290" x2="780" y2="290" class="grid"/><text x="75" y="295" text-anchor="end" class="s">15%</text>
<line x1="90" y1="220" x2="780" y2="220" class="grid"/><text x="75" y="225" text-anchor="end" class="s">20%</text>
<line x1="90" y1="150" x2="780" y2="150" class="grid"/><text x="75" y="155" text-anchor="end" class="s">25%</text>
<line x1="90" y1="80" x2="780" y2="80" class="grid"/><text x="75" y="85" text-anchor="end" class="s">30%</text>
<text x="125" y="530" class="s" text-anchor="middle">2010</text><text x="230" y="530" class="s" text-anchor="middle">2011</text><text x="335" y="530" class="s" text-anchor="middle">2012</text><text x="440" y="530" class="s" text-anchor="middle">2013</text><text x="545" y="530" class="s" text-anchor="middle">2014</text><text x="650" y="530" class="s" text-anchor="middle">2015</text><text x="755" y="530" class="s" text-anchor="middle">2016</text>
<line x1="335" y1="80" x2="335" y2="500" class="event"/><text x="345" y="100" class="s">2012</text>
<!-- y=500-(value/30*420) -->
<polyline points="125,130.4 230,271.6 335,288.6 440,338.2 545,396.3 650,409.4 755,467.5" class="d"/>
<polyline points="125,206.6 230,259.2 335,287.6 440,321.3 545,348.2 650,362.5 755,407.3" class="ln"/>
<line x1="100" y1="585" x2="140" y2="585" stroke="#111" stroke-width="3"/><text x="150" y="591" class="s">大连贷款增速</text>
<line x1="310" y1="585" x2="350" y2="585" stroke="#777" stroke-width="3" stroke-dasharray="9 5"/><text x="360" y="591" class="s">辽宁贷款增速</text>
<!-- right panel gap -->
<text x="885" y="88" class="h">大连 − 辽宁</text>
<line x1="850" y1="280" x2="1130" y2="280" class="axis"/><line x1="850" y1="120" x2="850" y2="490" class="axis"/>
<text x="835" y="145" text-anchor="end" class="s">+6pp</text><text x="835" y="285" text-anchor="end" class="s">0</text><text x="835" y="465" text-anchor="end" class="s">−5pp</text>
<!-- mapping gap y=280-gap*30 -->
<polyline points="870,116.7 910,307.9 950,283.1 990,316.2 1030,383.2 1070,380.5 1110,409.1" class="gap"/>
<circle cx="1030" cy="383.2" r="4.5" fill="white" stroke="#aaa"/><circle cx="1070" cy="380.5" r="4.5" fill="white" stroke="#aaa"/><circle cx="1110" cy="409.1" r="4.5" fill="white" stroke="#aaa"/>
<text x="1010" y="430" class="s">2014 −3.44pp</text><text x="1010" y="450" class="s">2015 −3.35pp</text>
<text x="100" y="635" class="s">2011—2012两地贷款增速已基本收敛；2013后大连开始持续落后，2014—2016差距明显扩大。</text>
</svg>